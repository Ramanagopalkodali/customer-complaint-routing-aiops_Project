name: complaint-routing
services:
  backend:
    image: complaint-routing-backend:local
    build:
      context: .
      target: backend
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim-bookworm}
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      SERVING_DIR: /app/artifacts/serving
      PIPELINE_ROOT: /workspace/project
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./reports:/app/reports
    - ./logs:/app/logs
    - .:/workspace/project:ro
    - ./.dvc/tmp:/workspace/project/.dvc/tmp
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',
        timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  frontend:
    image: complaint-routing-frontend:local
    build:
      context: .
      target: frontend
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim-bookworm}
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    environment:
      API_BASE_URL: http://backend:8000
    ports:
    - 127.0.0.1:8501:8501
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',
        timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=2d
    - --storage.tsdb.retention.size=256MB
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus_data:/prometheus
    depends_on:
    - backend
    - blackbox
    - node-exporter
  grafana:
    image: grafana/grafana:13.3.0
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD
        in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    depends_on:
    - prometheus
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command:
    - --config.file=/etc/blackbox/blackbox.yml
    volumes:
    - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
  node-exporter:
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
    - --path.rootfs=/host
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    volumes:
    - /:/host:ro,rslave
volumes:
  prometheus_data: {}
  grafana_data: {}
