name: complaint-routing

services:
  backend:
    image: complaint-routing-backend:local
    build:
      context: .
      target: backend
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim-bookworm}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SERVING_DIR: /app/artifacts/serving
      PIPELINE_ROOT: /workspace/project
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - .:/workspace/project:ro
      - ./.dvc/tmp:/workspace/project/.dvc/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: complaint-routing-frontend:local
    build:
      context: .
      target: frontend
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim-bookworm}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
